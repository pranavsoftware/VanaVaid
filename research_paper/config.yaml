MODULES_OVERVIEW:
  module_count: 5
  
  modules:
    1:
      name: "Temporal-Spatial Phytochemical Interpolation Engine"
      model: "Gaussian Process Regression"
      kernel: "RBF + White Noise + ARIMA seasonal"
      input_features: 6
      output_features: 4
      performance_metric: "R² = 0.639, RMSE = 0.504%"
      baseline_performance: "R² = 0.300, RMSE = 1.200%"
      improvement_percent: 113
    
    2:
      name: "Adaptive Bayesian Pharmacokinetic Prediction Engine"
      model: "Bayesian Neural Network"
      architecture: "128-64-32 with MC Dropout"
      input_features: 10
      output_features: 5
      performance_metric: "MAE = 1.97%, R² = 0.901"
      baseline_performance: "MAE = 6.34%, R² = 0.000"
      improvement_percent: 69
    
    3:
      name: "Dynamic Drug-Herbal Interaction Knowledge Graph"
      model: "Graph Neural Network"
      embedding_method: "DeepWalk"
      nodes: 245
      edges: 598
      performance_metric: "AUC = 0.993, Sensitivity = 0.972"
      baseline_performance: "AUC = 0.700, Coverage = 70%"
      improvement_percent: 42
    
    4:
      name: "Constraint-Optimized Reverse Botanical Recommendation Engine"
      model: "Multi-objective Constraint Satisfaction"
      algorithm: "Sequential descent with multi-constraint filtering"
      input_features: 8
      output_recommendations: 3
      performance_metric: "Quality score = 98.4/100"
      baseline_performance: "Quality score = 38.1/100"
      improvement_percent: 158
    
    5:
      name: "Multi-Spectral Bioactive Compound Quantification Engine"
      model: "5-Channel Convolutional Neural Network"
      input_channels: 5
      architecture: "Conv2D(32)-Conv2D(64)-Conv2D(128)-Dense(128)-Dense(4)"
      input_resolution: "224x224 pixels"
      output_features: 4
      performance_metric: "R² = 0.533, RMSE = 0.773%"
      speed_improvement: "518479x"
      cost_reduction: "250x"

